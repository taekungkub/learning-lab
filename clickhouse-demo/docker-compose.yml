# docker compose up -d
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: demo # image ใหม่บังคับตั้ง password ถ้าจะเข้าจากนอก container
      CLICKHOUSE_DB: demo
    ports:
      - "8123:8123" # HTTP: client + Web SQL UI ที่ http://localhost:8123/play
      - "9000:9000" # native protocol (clickhouse-client)
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ch-data:/var/lib/clickhouse

  mongo: # ไว้เทียบความเร็วกับ ClickHouse (examples/15) เก็บ time series collection
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: default
      MONGO_INITDB_ROOT_PASSWORD: demo
    ports:
      - "27018:27017" # 27018 เพราะ 27017 มี mongo ตัวอื่นใช้อยู่
    volumes:
      - mongo-data:/data/db

volumes:
  ch-data:
  mongo-data:
